name: Build Active24 deploy artifact

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct text source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .text-source/chunk*.b64 | base64 --decode > /tmp/janafitness-text-source.tar.xz
          echo "12f7342d1e883ecff324a88142648076a07ce5569723f5db282516d584ece529  /tmp/janafitness-text-source.tar.xz" | sha256sum -c -
          xz -t /tmp/janafitness-text-source.tar.xz
          tar -tJf /tmp/janafitness-text-source.tar.xz > /tmp/release-files.txt
          sed -n '1,80p' /tmp/release-files.txt

      - name: Extract release source
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-source
          tar -xJf /tmp/janafitness-text-source.tar.xz -C release-source
          test -f release-source/package.json
          test -f release-source/next.config.ts
          test -f release-source/scripts/prepare-deploy.mjs
          test -f release-source/php-api/checkout/create.php
          test -f 'release-source/src/app/(frontend)/(client)/app/platba/page.tsx'
          node -e "const p=require('./release-source/package.json'); console.log('release package version:', p.version)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: release-source
        run: npm install --no-audit --no-fund

      - name: Validate source
        working-directory: release-source
        run: npm run validate:source

      - name: Typecheck
        working-directory: release-source
        run: npm run typecheck

      - name: Lint
        working-directory: release-source
        run: npm run lint

      - name: Build static site
        working-directory: release-source
        run: npm run build

      - name: Prepare Active24 deploy tree
        working-directory: release-source
        run: npm run deploy:prepare

      - name: Package webroot
        shell: bash
        run: |
          set -euo pipefail
          cd release-source/deploy/web
          zip -r "$GITHUB_WORKSPACE/janafitness-v0.7.0-active24-web-textonly.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum janafitness-v0.7.0-active24-web-textonly.zip > janafitness-v0.7.0-active24-web-textonly.zip.sha256

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: janafitness-v0.7.0-active24-web-textonly
          path: |
            janafitness-v0.7.0-active24-web-textonly.zip
            janafitness-v0.7.0-active24-web-textonly.zip.sha256
          if-no-files-found: error
          retention-days: 7
