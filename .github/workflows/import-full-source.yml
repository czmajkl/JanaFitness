name: Import full source

on:
  push:
    paths:
      - .github/workflows/import-full-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/source.part00.b64 \
            .bootstrap/source.part01.b64 \
            .bootstrap/source.part02.b64 \
            .bootstrap/source.part03.b64 \
            .bootstrap/source.part04.b64 \
            .bootstrap/source.part05.b64 \
            .bootstrap/source.part06.b64 \
            .bootstrap/source.part07a.b64 \
            .bootstrap/source.part07b.b64 \
            .bootstrap/source.part07c.b64 \
            .bootstrap/source.part07d.b64 \
            | base64 --decode > /tmp/janafitness-source.zip
          unzip -t /tmp/janafitness-source.zip

      - name: Import complete project tree
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/janafitness-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/import-full-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JanaFitness Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: complete full application source import"
          git push origin HEAD:main
